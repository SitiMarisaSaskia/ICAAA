<style>
:root{
  --ungu-tua:#54449a; --ungu:#8272d6; --ungu-muda:#d4c8fa; --lavender:#efeaff;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Quicksand',system-ui,sans-serif;color:var(--teks);line-height:1.65;
  background:linear-gradient(165deg,#e4d9ff 0%,#d3dcff 40%,#c4e4ff 75%,#e6f5ff 100%) fixed;min-height:100vh}
h1,h2,h3{font-family:'Fredoka','Quicksand',sans-serif;margin:0;line-height:1.2}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 60px}

.bunga{position:fixed;top:-40px;font-size:22px;opacity:.5;pointer-events:none;animation:jatuh linear infinite;z-index:0}
@keyframes jatuh{to{transform:translateY(110vh) rotate(360deg)}}

header{position:relative;z-index:1;text-align:center;padding:36px 0 10px}
.kucing{width:150px;height:auto;animation:goyang 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes goyang{50%{transform:rotate(4deg)}}
header h1{font-size:clamp(2.2rem,8vw,3.6rem);margin-top:6px;background:linear-gradient(90deg,#7a63d6,#4a9ad8);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:6px 0 0;color:var(--muted);font-weight:600}

nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  padding:12px 8px;margin:14px -16px 20px;background:rgba(226,236,255,.88);backdrop-filter:blur(6px)}
nav button{font:600 1rem 'Fredoka',sans-serif;color:var(--ungu-tua);background:#fff;border:2px solid var(--ungu-muda);
  border-radius:999px;padding:8px 20px;cursor:pointer;transition:.15s}
nav button:hover{background:var(--ungu-muda)}
nav button[aria-selected="true"]{background:var(--ungu);border-color:var(--ungu);color:#fff}
nav button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

section{display:none;position:relative;z-index:1}
section.aktif{display:block}
.kartu{background:#fff;border:2px solid var(--ungu-muda);border-radius:26px;padding:24px;
  box-shadow:0 8px 0 var(--ungu-muda);margin-bottom:26px}
.kartu h2{color:var(--ungu-tua);font-size:1.7rem;margin-bottom:14px}

.bio{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:start}
.profil{aspect-ratio:1;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 4px var(--ungu-muda);background:var(--lavender);
  display:grid;place-items:center;font-size:84px;overflow:hidden}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
dt{background:var(--lavender);color:var(--ungu-tua);font-weight:700;border-radius:12px;padding:2px 14px;height:fit-content}
dd{margin:0;align-self:center;overflow-wrap:anywhere}

.galeri{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.foto{margin:0;border:3px solid var(--ungu-muda);border-radius:22px;overflow:hidden;background:var(--lavender);cursor:zoom-in}
.foto .gbr{aspect-ratio:4/3;display:grid;place-items:center;font-size:56px;color:var(--ungu);overflow:hidden}
.foto figcaption{padding:8px 12px;font-weight:700;background:#fff;border-top:3px solid var(--ungu-muda);color:var(--ungu-tua)}

.video{aspect-ratio:16/9;border-radius:20px;overflow:hidden;border:3px solid var(--ungu);background:#1b1030}
.video video,.video iframe{width:100%;height:100%;border:0;display:block}
.kosong{height:100%;display:grid;place-items:center;text-align:center;color:var(--ungu-muda);padding:20px}

.isi p{margin:0 0 12px}
.tombol{display:inline-block;font:600 1rem 'Fredoka',sans-serif;color:#fff;background:var(--ungu);
  border-radius:999px;padding:8px 22px;text-decoration:none;border:0;cursor:pointer}
.tombol:hover{background:var(--ungu-tua)}
.tombol.mati{background:var(--ungu-muda);pointer-events:none}

.embed{width:100%;height:760px;border:3px solid var(--ungu-muda);border-radius:18px;background:#fff;margin-top:8px}
.taman{display:block;width:min(100%,520px);margin:0 auto;position:relative;z-index:1}

/* sajian data */
.ringkas{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:6px 0 14px}
.angka{background:linear-gradient(135deg,var(--lavender),#e3f2ff);border:2px solid var(--ungu-muda);border-radius:18px;padding:10px 14px;text-align:center}
.angka b{display:block;font:700 2rem 'Fredoka',sans-serif;color:var(--ungu-tua);line-height:1.1}
.angka span{color:var(--muted);font-weight:700;font-size:.9rem}
.kontrol{margin:12px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kontrol select,.kontrol input[type=search]{font:inherit;padding:7px 14px;border:2px solid var(--ungu-muda);border-radius:999px;background:#fff;color:var(--teks);max-width:100%}
.kontrol select{text-overflow:ellipsis}
.kontrol input[type=search]{flex:1;min-width:200px}
.grafik{border:2px solid var(--ungu-muda);border-radius:18px;padding:14px;background:#fbfaff}
.grafik h3{font-size:1.1rem;color:var(--ungu-tua);margin-bottom:10px}
.baris{display:grid;grid-template-columns:minmax(70px,32%) 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-weight:600}
.baris .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trek{background:#ece7fb;border-radius:999px;height:16px;overflow:hidden}
.isi-bar{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#b9a6f0,#8ecbf5)}
.isi-bar.w1{background:linear-gradient(90deg,#f7a8d0,#b9a6f0)}
.isi-bar.w2{background:linear-gradient(90deg,#8ecbf5,#9be0bb)}
.baris b{text-align:right;color:var(--ungu-tua)}
.tabelbox{overflow:auto;max-height:480px;border:2px solid var(--ungu-muda);border-radius:18px}
.tabel{border-collapse:collapse;width:100%;font-size:.95rem}
.tabel th{position:sticky;top:0;background:var(--ungu-muda);color:var(--ungu-tua);text-align:left;padding:8px 12px;white-space:nowrap;cursor:pointer;font-family:'Fredoka',sans-serif}
.tabel td{padding:7px 12px;border-top:1px solid #ece7fb;vertical-align:top;min-width:70px}
.tabel tbody tr:nth-child(even){background:#f8f5ff}
.tabel tbody tr:hover{background:#e9f4ff}
.kosongtbl{text-align:center;color:var(--muted);padding:18px!important}
.galat{background:#fff4f8;border:2px dashed var(--pink);border-radius:18px;padding:18px;text-align:center}
.galat .tombol{margin:8px 4px 0}
details.form{margin-top:18px;border:2px solid var(--ungu-muda);border-radius:18px;padding:10px 14px}
details.form summary{cursor:pointer;font:600 1.05rem 'Fredoka',sans-serif;color:var(--ungu-tua)}
.catatan{font-size:.95rem;color:var(--muted);margin-top:12px}
.catatan a{color:var(--ungu-tua);font-weight:700}

footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-weight:600;padding:10px 0}

@media (max-width:600px){
  .bio{grid-template-columns:1fr}.profil{max-width:170px;margin:0 auto}
  nav button{padding:7px 14px;font-size:.92rem}
}
@media (prefers-reduced-motion:reduce){.kucing,.bunga{animation:none}.bunga{display:none}}
</style>

function parseCSV(t){
  const r=[]; let row=[], c='', q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){c+='"';i++;} else q=false; } else c+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(c); c=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; row.push(c); r.push(row); row=[]; c=''; }
    else c+=ch;
  }
  if(c!==''||row.length){ row.push(c); r.push(row); }
  return r.filter(x=>x.some(v=>v.trim()!==''));
}

async function muatData(n){
  const su = TUGAS[n].sheetUrl || '', box = $('#data'+n);
  const mid = su.match(/\/d\/([\w-]+)/), mg = su.match(/gid=(\d+)/);
  const cfg = { id: mid ? mid[1] : '', gid: mg ? mg[1] : '0' };
  const asli = cfg.id ? `https://docs.google.com/spreadsheets/d/${cfg.id}/edit?gid=${cfg.gid}` : '';
  box.innerHTML = '<p class="catatan">Memuat data… 🐾</p>';

  let teks = null, sumber = 'live';
  if (cfg.id) {
    const urls = [
      `https://docs.google.com/spreadsheets/d/${cfg.id}/gviz/tq?tqx=out:csv&gid=${cfg.gid}`,
      `https://docs.google.com/spreadsheets/d/${cfg.id}/export?format=csv&gid=${cfg.gid}`
    ];
    for(const u of urls){
      try{
        const r = await fetch(u);
        if(r.ok){ const t = await r.text(); if(!/^\s*<(!doctype|html)/i.test(t)){ teks = t; break; } }
      }catch(e){}
    }
  }
  if(!teks && TUGAS[n].csvData){
    teks = TUGAS[n].csvData;
    sumber = 'lokal';
  }
  if(!teks){
    box.innerHTML = `<div class="galat">😿 Data belum bisa dimuat.<br>Pastikan spreadsheet dibagikan dengan akses <b>"Siapa saja yang memiliki link"</b> sebagai <b>Pelihat</b>.<br>
      <button class="tombol" id="ulang${n}">Coba lagi</button>${asli ? ` <a class="tombol" href="${esc(asli)}" target="_blank" rel="noopener">Buka spreadsheet</a>` : ''}</div>`;
    $('#ulang'+n).onclick = () => muatData(n);
    return;
  }

  const rows = parseCSV(teks);
  if(rows.length < 2){ box.innerHTML = '<p class="catatan">Spreadsheet masih kosong 🌷</p>'; return; }
  const head = rows[0].map(h => h.trim() || 'Kolom');
  const data = rows.slice(1);
  const kolom = head.map((h,i)=>i).filter(i => !KOLOM_PRIBADI.test(head[i]));
  const st = { q:'', sort:-1, asc:true, chart:-1 };

  const unik = i => new Set(data.map(r => (r[i]||'').trim()).filter(Boolean));
  const calon = kolom.filter(i => !/timestamp|cap waktu|waktu/i.test(head[i]) && unik(i).size>=2 && unik(i).size<=12);
  st.chart = calon.length ? calon[0] : -1;

  box.innerHTML = `
    <div class="ringkas">
      <div class="angka"><b>${data.length}</b><span>Jumlah data</span></div>
      <div class="angka"><b>${kolom.length}</b><span>Kolom</span></div>
    </div>
    <div class="kontrol">
      <label>Grafik kolom:
        <select id="pilih${n}">${kolom.map(i=>`<option value="${i}" ${i===st.chart?'selected':''}>${esc(head[i])}</option>`).join('')}</select>
      </label>
    </div>
    <div class="grafik" id="grafik${n}"></div>
    <div class="kontrol"><input type="search" id="cari${n}" placeholder="🔍 Cari data…" aria-label="Cari data"></div>
    <div class="tabelbox"><table class="tabel" id="tabel${n}"></table></div>
    <p class="catatan" id="info${n}"></p>
    <div class="kontrol">${asli ? `<a class="tombol" href="${esc(asli)}" target="_blank" rel="noopener">Buka spreadsheet asli</a> ` : ''}<button class="tombol" id="ulang${n}">Muat ulang 🔄</button></div>`;

  function gambarGrafik(){
    const g = $('#grafik'+n);
    if(st.chart<0){ g.innerHTML=''; return; }
    const hit = {};
    data.forEach(r => { const v=(r[st.chart]||'').trim(); if(v) hit[v]=(hit[v]||0)+1; });
    const urut = Object.entries(hit).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const maks = urut.length ? urut[0][1] : 1;
    g.innerHTML = `<h3>${esc(head[st.chart])}</h3>` + urut.map(([k,v],i)=>`
      <div class="baris"><span class="lbl" title="${esc(k)}">${esc(k)}</span>
      <span class="trek"><span class="isi-bar w${i%3}" style="width:${Math.max(4,v/maks*100)}%"></span></span><b>${v}</b></div>`).join('');
  }
  function gambarTabel(){
    let list = data.slice();
    if(st.q){ const q=st.q.toLowerCase(); list = list.filter(r => kolom.some(i => (r[i]||'').toLowerCase().includes(q))); }
    if(st.sort>=0){
      list = list.slice().sort((a,b)=>{
        const x=(a[st.sort]||'').trim(), y=(b[st.sort]||'').trim();
        const nx=parseFloat(x.replace(',','.')), ny=parseFloat(y.replace(',','.'));
        const c = (!isNaN(nx)&&!isNaN(ny)&&/^[-\d.,\s]+$/.test(x+y)) ? nx-ny : x.localeCompare(y,'id');
        return st.asc ? c : -c;
      });
    }
    $('#tabel'+n).innerHTML =
      '<thead><tr><th>#</th>' + kolom.map(i=>`<th data-k="${i}" tabindex="0" role="button">${esc(head[i])}${st.sort===i?(st.asc?' ▲':' ▼'):''}</th>`).join('') + '</tr></thead>' +
      '<tbody>' + (list.length ? list.map((r,k)=>`<tr><td>${k+1}</td>${kolom.map(i=>`<td>${esc(r[i]||'')}</td>`).join('')}</tr>`).join('') :
        `<tr><td colspan="${kolom.length+1}" class="kosongtbl">Tidak ada data yang cocok 🍃</td></tr>`) + '</tbody>';
    $('#info${n}'.replace('${n}', n)).textContent =
      `Menampilkan ${list.length} dari ${data.length} data.` +
      (kolom.length<head.length ? ' Kolom data pribadi (email) disembunyikan.' : '') +
      (sumber==='lokal' ? ' (Menampilkan data cadangan lokal)' : '');
  }
  $('#pilih'+n).onchange = e => { st.chart = +e.target.value; gambarGrafik(); };
  $('#cari'+n).oninput = e => { st.q = e.target.value; gambarTabel(); };
  $('#ulang'+n).onclick = () => muatData(n);
  const urutKlik = e => { const th = e.target.closest('th[data-k]'); if(!th) return; const k=+th.dataset.k; st.asc = st.sort===k ? !st.asc : true; st.sort=k; gambarTabel(); };
  $('#tabel'+n).addEventListener('click', urutKlik);
  $('#tabel'+n).addEventListener('keydown', e => { if(e.key==='Enter') urutKlik(e); });
  gambarGrafik(); gambarTabel();
}

[2,3,4].forEach(n => {
  const t = TUGAS[n];
  let link = `<h2>🔗 ${esc(t.judul)}: Link</h2><p>${esc(t.deskripsiLink)}</p>`;
  if (t.links && t.links.length) {
    link += '<div class="kontrol">' + t.links.map(l => `<a class="tombol" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('') + '</div>';
  } else {
    link += '<span class="tombol mati">Belum ada link</span>';
  }
  if (t.formEmbed) link += `<details class="form"><summary>📝 Isi formulir di halaman ini</summary>
      <iframe class="embed" src="${esc(t.formEmbed)}" title="Formulir ${esc(t.judul)}" loading="lazy">Memuat…</iframe></details>`;

  let dat = `<h2>📊 ${esc(t.judul)}: Sajian Data</h2><p>${esc(t.deskripsiData)}</p>`;
  dat += (t.sheetUrl || t.csvData) ? `<div class="data" id="data${n}"></div>` : '<span class="tombol mati">Belum ada spreadsheet</span>';

  $('#tugas'+n).innerHTML = `<div class="kartu isi">${link}</div><div class="kartu isi">${dat}</div>`;
  if (t.sheetUrl || t.csvData) muatData(n);
});
